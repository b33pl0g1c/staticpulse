# Builds the StaticPulse Docker image, smoke-tests it, and publishes it to the
# GitHub Container Registry (ghcr.io/<owner>/staticpulse) so anyone can
# `docker run` it. Runs on push to main and on version tags.
name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}:latest .

      - name: Smoke test (image runs and the CLI is importable)
        run: docker run --rm ghcr.io/${{ github.repository }}:latest --help

      - name: Push image
        run: docker push ghcr.io/${{ github.repository }}:latest
